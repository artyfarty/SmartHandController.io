; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
framework = arduino
platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.14
lib_deps =
	olikraus/U8g2@^2.35.19
	https://github.com/artyfarty/ephemeris.git#master

[env:esp32dev]
extends = common
platform = espressif32
board = esp32dev
board_build.f_cpu = 80000000L
board_build.partitions = huge_app.csv

[env:esp32dev_encoder_control]
extends = env:esp32dev
lib_deps = ${env:esp32dev.lib_deps}
	madhephaestus/ESP32Encoder
build_src_flags =
			-DENCODER_SLEW_CONTROL=ON
			-DSLEW_ENCODER_TYPE=AB_ESP32